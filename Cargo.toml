# DivineOS - Cargo Workspace Configuration

[workspace]
members = [
    "kernel",
    "ai-runtime",
    "ipc",
    "telemetry",
    "utils",
    "simulation",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["DivineOS Team"]
edition = "2021"
license = "MIT"
description = "AI-native operating system kernel and runtime"

# Workspace-level dependencies
[workspace.dependencies]
# Core system dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
prost = "0.12"
prost-types = "0.12"
tonic = "0.10"
bytes = "1.0"
futures = "0.3"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

# AI-related dependencies
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
tch = "0.15"
candle = "0.3"
rayon = "1.5"

# Testing dependencies
tokio-test = "0.4"
mockall = "0.11"